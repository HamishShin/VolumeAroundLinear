<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Volume of Revolution Visualizer</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      padding: 20px;
      gap: 20px;
      justify-content: center;
    }

    .panel {
      background: #1f2937;
      padding: 20px;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    input {
      width: 100%;
      margin-top: 5px;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #374151;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    canvas {
      background: white;
      border-radius: 15px;
      max-width: 100%;
    }

    .result {
      margin-top: 15px;
      font-size: 18px;
      line-height: 1.6;
    }

    .formula {
      background: #111827;
      padding: 10px;
      border-radius: 10px;
      overflow-wrap: break-word;
    }
  </style>
</head>
<body>

<h1>Volume of Revolution Calculator</h1>

<div class="container">

  <div class="panel">

    <label>Upper Curve f(x)</label>
    <input id="fInput" value="2*x - x*x/4">

    <label>Lower Curve g(x)</label>
    <input id="gInput" value="x/2">

    <label>Axis of Revolution (linear equation)</label>
    <input id="axisInput" value="y=0">

    <label>Left Bound</label>
    <input id="aInput" value="0">

    <label>Right Bound</label>
    <input id="bInput" value="4">

    <button onclick="calculate()">Calculate & Visualize</button>

    <div class="result" id="result"></div>

  </div>

  <canvas id="graph" width="700" height="700"></canvas>

</div>

<script>
const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");

function parseFunction(str) {
  return new Function("x", "return " + str);
}

function parseAxis(str) {
  str = str.replace(/\s/g, '');

  if (str.startsWith('y=')) {
    return {
      type: 'horizontal',
      value: parseFloat(str.slice(2))
    };
  }

  if (str.startsWith('x=')) {
    return {
      type: 'vertical',
      value: parseFloat(str.slice(2))
    };
  }

  throw "Axis must be y=c or x=c";
}

function integrate(func, a, b, n = 5000) {
  let dx = (b - a) / n;
  let sum = 0;

  for (let i = 0; i < n; i++) {
    let x = a + i * dx + dx / 2;
    sum += func(x) * dx;
  }

  return sum;
}

function worldToCanvas(x, y) {
  const scale = 60;
  return {
    x: canvas.width / 2 + x * scale,
    y: canvas.height / 2 - y * scale
  };
}

function drawAxes() {
  ctx.strokeStyle = "#cccccc";
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.moveTo(0, canvas.height / 2);
  ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.stroke();
}

function drawCurve(func, color, a, b) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.beginPath();

  let first = true;

  for (let x = a; x <= b; x += 0.01) {
    let y = func(x);
    let p = worldToCanvas(x, y);

    if (first) {
      ctx.moveTo(p.x, p.y);
      first = false;
    } else {
      ctx.lineTo(p.x, p.y);
    }
  }

  ctx.stroke();
}

function shadeRegion(f, g, a, b) {
  ctx.fillStyle = "rgba(59,130,246,0.3)";
  ctx.beginPath();

  let first = true;

  for (let x = a; x <= b; x += 0.01) {
    let y = f(x);
    let p = worldToCanvas(x, y);

    if (first) {
      ctx.moveTo(p.x, p.y);
      first = false;
    } else {
      ctx.lineTo(p.x, p.y);
    }
  }

  for (let x = b; x >= a; x -= 0.01) {
    let y = g(x);
    let p = worldToCanvas(x, y);
    ctx.lineTo(p.x, p.y);
  }

  ctx.closePath();
  ctx.fill();
}

function drawAxis(axis) {
  ctx.strokeStyle = "red";
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 10]);

  ctx.beginPath();

  if (axis.type === 'horizontal') {
    let p1 = worldToCanvas(-100, axis.value);
    let p2 = worldToCanvas(100, axis.value);

    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
  } else {
    let p1 = worldToCanvas(axis.value, -100);
    let p2 = worldToCanvas(axis.value, 100);

    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
  }

  ctx.stroke();
  ctx.setLineDash([]);
}

function calculate() {

  try {

    const fStr = document.getElementById("fInput").value;
    const gStr = document.getElementById("gInput").value;

    const f = parseFunction(fStr);
    const g = parseFunction(gStr);

    const axis = parseAxis(
      document.getElementById("axisInput").value
    );

    const a = parseFloat(document.getElementById("aInput").value);
    const b = parseFloat(document.getElementById("bInput").value);

    let volume;
    let setup;

    if (axis.type === 'horizontal') {

      const c = axis.value;

      volume = Math.PI * integrate(x => {
        let R = Math.abs(f(x) - c);
        let r = Math.abs(g(x) - c);

        return R*R - r*r;
      }, a, b);

      setup = `
        V = π ∫[${a}, ${b}] (
        (${fStr} - ${c})²
        -
        (${gStr} - ${c})²
        ) dx
      `;

    } else {

      const c = axis.value;

      volume = Math.PI * integrate(x => {
        let R = Math.abs(x - c);
        return R * (f(x) - g(x));
      }, a, b) * 2;

      setup = `
        Shell Method:
        V = 2π ∫[${a}, ${b}]
        (${c} - x)
        (${fStr} - (${gStr}))
        dx
      `;
    }

    document.getElementById("result").innerHTML = `
      <div class="formula">
        <strong>Integral Setup:</strong><br><br>
        ${setup}
      </div>

      <br>

      <strong>Approximate Volume:</strong><br>
      ${volume.toFixed(6)}
    `;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawAxes();
    shadeRegion(f, g, a, b);
    drawCurve(f, "#22c55e", a-2, b+2);
    drawCurve(g, "#f59e0b", a-2, b+2);
    drawAxis(axis);

  } catch(err) {
    alert("Error: " + err);
  }
}

calculate();
</script>

</body>
</html>
