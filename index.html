<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Volume of Revolution Visualizer</title>

<style>

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
}

h1{
    text-align:center;
    margin:15px;
}

.container{
    display:flex;
    gap:20px;
    padding:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.panel{
    width:340px;
    background:#1e293b;
    padding:20px;
    border-radius:15px;
}

label{
    display:block;
    margin-top:10px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    border-radius:8px;
    background:#334155;
    color:white;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

canvas{
    background:white;
    border-radius:15px;
    cursor:grab;
}

.result{
    margin-top:15px;
    line-height:1.6;
}

.formula{
    background:#111827;
    padding:10px;
    border-radius:10px;
}

</style>
</head>
<body>

<h1>Volume of Revolution Visualizer</h1>

<div class="container">

<div class="panel">

<label>Upper Curve f(x)</label>
<input id="fInput" value="2*x - x^2/4">

<label>Lower Curve g(x)</label>
<input id="gInput" value="x/2">

<label>Axis of Revolution</label>
<input id="axisInput" value="y=0">

<label>Left Bound</label>
<input id="aInput" value="0">

<label>Right Bound</label>
<input id="bInput" value="4">

<button onclick="calculate()">Calculate</button>

<div class="result" id="result"></div>

<p>
Scroll to zoom<br>
Drag to pan
</p>

</div>

<canvas id="canvas" width="800" height="700"></canvas>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let scale = 60;
let offsetX = canvas.width/2;
let offsetY = canvas.height/2;

let dragging = false;
let lastX,lastY;

canvas.addEventListener("mousedown",e=>{
    dragging=true;
    lastX=e.clientX;
    lastY=e.clientY;
});

window.addEventListener("mouseup",()=>{
    dragging=false;
});

window.addEventListener("mousemove",e=>{
    if(!dragging) return;

    offsetX += e.clientX-lastX;
    offsetY += e.clientY-lastY;

    lastX=e.clientX;
    lastY=e.clientY;

    calculate();
});

canvas.addEventListener("wheel",e=>{
    e.preventDefault();

    const zoom = e.deltaY < 0 ? 1.1 : 0.9;

    scale *= zoom;

    calculate();
});

function preprocess(expr){

    expr = expr.replace(/\^/g,"**");

    const funcs = [
        "sin","cos","tan",
        "sqrt","log","abs",
        "asin","acos","atan",
        "exp"
    ];

    funcs.forEach(f=>{
        expr = expr.replaceAll(f,`Math.${f}`);
    });

    return expr;
}

function makeFunction(expr){

    expr = preprocess(expr);

    return new Function("x",`
        return ${expr};
    `);
}

function integrate(func,a,b,n=5000){

    let dx = (b-a)/n;
    let sum = 0;

    for(let i=0;i<n;i++){

        let x = a + i*dx + dx/2;

        let y = func(x);

        if(!isFinite(y)) continue;

        sum += y*dx;
    }

    return sum;
}

function toCanvas(x,y){

    return {
        x: offsetX + x*scale,
        y: offsetY - y*scale
    };
}

function drawGrid(){

    ctx.strokeStyle="#e5e7eb";
    ctx.lineWidth=1;

    const step = scale;

    for(let x=offsetX%step;x<canvas.width;x+=step){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);
        ctx.stroke();
    }

    for(let y=offsetY%step;y<canvas.height;y+=step){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);
        ctx.stroke();
    }
}

function drawAxes(){

    ctx.strokeStyle="black";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(0,offsetY);
    ctx.lineTo(canvas.width,offsetY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(offsetX,0);
    ctx.lineTo(offsetX,canvas.height);
    ctx.stroke();
}

function drawCurve(func,color){

    ctx.strokeStyle=color;
    ctx.lineWidth=3;

    ctx.beginPath();

    let first=true;

    for(let px=0;px<canvas.width;px++){

        let x = (px-offsetX)/scale;

        let y;

        try{
            y = func(x);
        }catch{
            continue;
        }

        if(!isFinite(y)) continue;

        let py = offsetY - y*scale;

        if(first){
            ctx.moveTo(px,py);
            first=false;
        }else{
            ctx.lineTo(px,py);
        }
    }

    ctx.stroke();
}

function shadeRegion(f,g,a,b){

    ctx.fillStyle="rgba(59,130,246,0.35)";
    ctx.beginPath();

    let first=true;

    for(let x=a;x<=b;x+=0.01){

        let y=f(x);

        let p=toCanvas(x,y);

        if(first){
            ctx.moveTo(p.x,p.y);
            first=false;
        }else{
            ctx.lineTo(p.x,p.y);
        }
    }

    for(let x=b;x>=a;x-=0.01){

        let y=g(x);

        let p=toCanvas(x,y);

        ctx.lineTo(p.x,p.y);
    }

    ctx.closePath();
    ctx.fill();
}

function drawAxis(axis){

    ctx.strokeStyle="red";
    ctx.lineWidth=2;

    ctx.setLineDash([10,10]);

    ctx.beginPath();

    if(axis.type==="horizontal"){

        let p=toCanvas(0,axis.value);

        ctx.moveTo(0,p.y);
        ctx.lineTo(canvas.width,p.y);

    }else{

        let p=toCanvas(axis.value,0);

        ctx.moveTo(p.x,0);
        ctx.lineTo(p.x,canvas.height);
    }

    ctx.stroke();

    ctx.setLineDash([]);
}

function parseAxis(str){

    str=str.replace(/\s/g,'');

    if(str.startsWith("y=")){

        return {
            type:"horizontal",
            value:Number(str.slice(2))
        };
    }

    if(str.startsWith("x=")){

        return {
            type:"vertical",
            value:Number(str.slice(2))
        };
    }

    throw "Axis must look like y=2 or x=-1";
}

function calculate(){

    try{

        const fExpr=document.getElementById("fInput").value;
        const gExpr=document.getElementById("gInput").value;

        const f=makeFunction(fExpr);
        const g=makeFunction(gExpr);

        const a=Number(document.getElementById("aInput").value);
        const b=Number(document.getElementById("bInput").value);

        const axis=parseAxis(
            document.getElementById("axisInput").value
        );

        let volume;
        let setup;

        if(axis.type==="horizontal"){

            const c=axis.value;

            volume = Math.PI * integrate(x=>{

                const R=Math.abs(f(x)-c);
                const r=Math.abs(g(x)-c);

                return R*R-r*r;

            },a,b);

            setup=`
V = π ∫[${a},${b}] [(${fExpr}-(${c}))² - (${gExpr}-(${c}))²] dx
`;

        }else{

            const c=axis.value;

            volume = 2*Math.PI*integrate(x=>{

                const radius=Math.abs(x-c);
                const height=Math.abs(f(x)-g(x));

                return radius*height;

            },a,b);

            setup=`
V = 2π ∫[${a},${b}] |x-${c}|(${fExpr}-(${gExpr})) dx
`;
        }

        document.getElementById("result").innerHTML=`

<div class="formula">
${setup}
</div>

<br>

<b>Approximate Volume:</b><br>
${volume.toFixed(6)}

`;

        ctx.clearRect(0,0,canvas.width,canvas.height);

        drawGrid();
        drawAxes();
        shadeRegion(f,g,a,b);

        drawCurve(f,"#22c55e");
        drawCurve(g,"#f59e0b");

        drawAxis(axis);

    }catch(err){

        document.getElementById("result").innerHTML=
        `<span style="color:red">${err}</span>`;
    }
}

calculate();

</script>

</body>
</html>
