<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Volume Around Linear Equation</title>

<style>

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
}

h1{
    text-align:center;
    margin:15px;
}

.container{
    display:flex;
    gap:20px;
    padding:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.panel{
    width:360px;
    background:#1e293b;
    padding:20px;
    border-radius:15px;
}

label{
    display:block;
    margin-top:10px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    border-radius:8px;
    background:#334155;
    color:white;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

canvas{
    background:white;
    border-radius:15px;
}

.result{
    margin-top:15px;
    line-height:1.7;
}

.formula{
    background:#111827;
    padding:10px;
    border-radius:10px;
    overflow-wrap:break-word;
}

</style>
</head>
<body>

<h1>Volume Around a Linear Equation</h1>

<div class="container">

<div class="panel">

<label>Curve f(x)</label>
<input id="fInput" value="x^2">

<label>Axis of Revolution</label>
<input id="axisInput" value="y=x">

<label>Lower Bound</label>
<input id="aInput" value="0">

<label>Upper Bound</label>
<input id="bInput" value="2">

<button onclick="calculate()">Calculate</button>

<div class="result" id="result"></div>

<p>
Scroll to zoom<br>
Drag to pan
</p>

</div>

<canvas id="canvas" width="850" height="700"></canvas>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let scale = 70;
let offsetX = canvas.width/2;
let offsetY = canvas.height/2;

let dragging=false;
let lastX,lastY;

canvas.addEventListener("mousedown",e=>{
    dragging=true;
    lastX=e.clientX;
    lastY=e.clientY;
});

window.addEventListener("mouseup",()=>{
    dragging=false;
});

window.addEventListener("mousemove",e=>{

    if(!dragging) return;

    offsetX += e.clientX-lastX;
    offsetY += e.clientY-lastY;

    lastX=e.clientX;
    lastY=e.clientY;

    redraw();
});

canvas.addEventListener("wheel",e=>{

    e.preventDefault();

    scale *= e.deltaY < 0 ? 1.1 : 0.9;

    redraw();
});

function preprocess(expr){

    expr = expr.replace(/\^/g,"**");

    const funcs = [
        "sin","cos","tan",
        "sqrt","log","abs",
        "asin","acos","atan",
        "exp"
    ];

    funcs.forEach(f=>{
        expr = expr.replaceAll(f,`Math.${f}`);
    });

    return expr;
}

function makeFunction(expr){

    expr = preprocess(expr);

    return new Function("x",`
        return ${expr};
    `);
}

function derivative(f,x,h=1e-5){

    return (f(x+h)-f(x-h))/(2*h);
}

function integrate(func,a,b,n=12000){

    let dx=(b-a)/n;
    let sum=0;

    for(let i=0;i<n;i++){

        let x=a+i*dx+dx/2;

        let y=func(x);

        if(isFinite(y)){
            sum += y*dx;
        }
    }

    return sum;
}

function parseLine(str){

    str=str.replace(/\s/g,'');

    if(!str.startsWith("y=")){
        throw "Axis must look like y=mx+b";
    }

    let rhs=str.slice(2);

    let m=0;
    let b=0;

    if(rhs.includes("x")){

        let parts=rhs.split("x");

        let mStr=parts[0];

        if(mStr==="" || mStr==="+"){
            m=1;
        }
        else if(mStr==="-"){
            m=-1;
        }
        else{
            m=Number(mStr);
        }

        if(parts[1]){
            b=Number(parts[1]);
        }

    }else{

        m=0;
        b=Number(rhs);
    }

    return {m,b};
}

function toCanvas(x,y){

    return {
        x: offsetX + x*scale,
        y: offsetY - y*scale
    };
}

function drawGrid(){

    ctx.strokeStyle="#e5e7eb";
    ctx.lineWidth=1;

    let step=scale;

    for(let x=offsetX%step;x<canvas.width;x+=step){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);
        ctx.stroke();
    }

    for(let y=offsetY%step;y<canvas.height;y+=step){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);
        ctx.stroke();
    }
}

function drawAxes(){

    ctx.strokeStyle="black";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(0,offsetY);
    ctx.lineTo(canvas.width,offsetY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(offsetX,0);
    ctx.lineTo(offsetX,canvas.height);
    ctx.stroke();
}

function drawCurve(f,color){

    ctx.strokeStyle=color;
    ctx.lineWidth=3;

    ctx.beginPath();

    let first=true;

    for(let px=0;px<canvas.width;px++){

        let x=(px-offsetX)/scale;

        let y;

        try{
            y=f(x);
        }catch{
            continue;
        }

        if(!isFinite(y)) continue;

        let py=offsetY-y*scale;

        if(first){
            ctx.moveTo(px,py);
            first=false;
        }
        else{
            ctx.lineTo(px,py);
        }
    }

    ctx.stroke();
}

function drawLine(m,b){

    ctx.strokeStyle="red";
    ctx.lineWidth=2;

    ctx.setLineDash([10,10]);

    ctx.beginPath();

    let x1=-100;
    let y1=m*x1+b;

    let x2=100;
    let y2=m*x2+b;

    let p1=toCanvas(x1,y1);
    let p2=toCanvas(x2,y2);

    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(p2.x,p2.y);

    ctx.stroke();

    ctx.setLineDash([]);
}

function shadeRegion(f,m,b,a,u){

    ctx.fillStyle="rgba(59,130,246,0.35)";

    ctx.beginPath();

    let first=true;

    for(let x=a;x<=u;x+=0.01){

        let y=f(x);

        let p=toCanvas(x,y);

        if(first){
            ctx.moveTo(p.x,p.y);
            first=false;
        }else{
            ctx.lineTo(p.x,p.y);
        }
    }

    for(let x=u;x>=a;x-=0.01){

        let y=m*x+b;

        let p=toCanvas(x,y);

        ctx.lineTo(p.x,p.y);
    }

    ctx.closePath();
    ctx.fill();
}

let currentData=null;

function redraw(){

    if(!currentData) return;

    const {f,m,b,a,u}=currentData;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawGrid();
    drawAxes();

    shadeRegion(f,m,b,a,u);

    drawCurve(f,"#22c55e");
    drawCurve(x=>m*x+b,"#ef4444");

    drawLine(m,b);
}

function calculate(){

    try{

        const fExpr=document.getElementById("fInput").value;

        const f=makeFunction(fExpr);

        const axis=document.getElementById("axisInput").value;

        const {m,b}=parseLine(axis);

        const a=Number(document.getElementById("aInput").value);
        const u=Number(document.getElementById("bInput").value);

        /*
        Formula:

        π/(m²+1)^(3/2)
        ∫ (f(x)-mx-b)^2 (1+m f'(x)) dx
        */

        const integral = integrate(x=>{

            let fx=f(x);

            let fp=derivative(f,x);

            return (
                (fx - (m*x+b))**2
                *
                (1 + m*fp)
            );

        },a,u);

        const volume =
            Math.PI /
            Math.pow(m*m+1,1.5)
            *
            integral;

        const setup = `
V =
π / (m²+1)^(3/2)
∫[${a},${u}]
(${fExpr} - (${m}x + ${b}))²
(1 + ${m}f'(x))
dx
`;

        document.getElementById("result").innerHTML=`

<div class="formula">
${setup}
</div>

<br>

<b>Approximate Volume:</b><br>
${volume.toFixed(8)}

`;

        currentData={f,m,b,a,u};

        redraw();

    }catch(err){

        document.getElementById("result").innerHTML=
        `<span style="color:red">${err}</span>`;
    }
}

calculate();

</script>

</body>
</html>
