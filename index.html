<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Volume of Revolution Visualizer</title>

<style>

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

h1{
    text-align:center;
    margin:10px;
}

.container{
    display:flex;
    gap:20px;
    padding:20px;
    height:calc(100vh - 60px);
    box-sizing:border-box;
}

.panel{
    width:340px;
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    overflow:auto;
}

label{
    display:block;
    margin-top:10px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    border-radius:8px;
    background:#334155;
    color:white;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.formula{
    background:#111827;
    padding:10px;
    border-radius:10px;
    margin-top:15px;
}

canvas{
    background:white;
    border-radius:15px;
}

#graph2d{
    width:50%;
}

#viewer3d{
    width:50%;
    display:none;
}

</style>
</head>
<body>

<h1>Volume Around a Linear Equation</h1>

<div class="container">

<div class="panel">

<label>Curve f(x)</label>
<input id="fInput" value="x^2">

<label>Axis Line</label>
<input id="axisInput" value="y=x">

<label>Lower Bound</label>
<input id="aInput" value="0">

<label>Upper Bound</label>
<input id="bInput" value="2">

<button id="calcBtn">Calculate</button>

<button id="toggle3dBtn">Toggle 3D Visualizer</button>

<div id="result"></div>

<p>
Scroll to zoom<br>
Drag to pan / rotate
</p>

</div>

<canvas id="graph2d" width="700" height="700"></canvas>

<div id="viewer3d"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

//////////////////////////////////////////////////////////
// MATH
//////////////////////////////////////////////////////////

function preprocess(expr){

    expr = expr.replace(/\^/g,"**");

    const funcs = [
        "sin","cos","tan",
        "sqrt","log","abs",
        "asin","acos","atan",
        "exp"
    ];

    funcs.forEach(f=>{
        expr = expr.replaceAll(f,`Math.${f}`);
    });

    return expr;
}

function makeFunction(expr){

    expr = preprocess(expr);

    return new Function("x",`
        return ${expr};
    `);
}

function integrate(func,a,b,n=10000){

    let dx=(b-a)/n;
    let sum=0;

    for(let i=0;i<n;i++){

        let x=a+i*dx+dx/2;

        let y=func(x);

        if(isFinite(y)){
            sum += y*dx;
        }
    }

    return sum;
}

function parseLine(str){

    str=str.replace(/\s/g,'');

    if(!str.startsWith("y=")){
        throw "Axis must look like y=mx+b";
    }

    let rhs=str.slice(2);

    let m=0;
    let b=0;

    if(rhs.includes("x")){

        let parts=rhs.split("x");

        let mStr=parts[0];

        if(mStr==="" || mStr==="+"){
            m=1;
        }
        else if(mStr==="-"){
            m=-1;
        }
        else{
            m=Number(mStr);
        }

        if(parts[1]){
            b=Number(parts[1]);
        }

    }else{

        b=Number(rhs);
    }

    return {m,b};
}

//////////////////////////////////////////////////////////
// 2D GRAPH
//////////////////////////////////////////////////////////

const canvas=document.getElementById("graph2d");
const ctx=canvas.getContext("2d");

let scale=60;
let offsetX=canvas.width/2;
let offsetY=canvas.height/2;

let dragging=false;
let lastX,lastY;

canvas.addEventListener("mousedown",e=>{

    dragging=true;

    lastX=e.clientX;
    lastY=e.clientY;
});

window.addEventListener("mouseup",()=>{

    dragging=false;
});

window.addEventListener("mousemove",e=>{

    if(!dragging) return;

    offsetX += e.clientX-lastX;
    offsetY += e.clientY-lastY;

    lastX=e.clientX;
    lastY=e.clientY;

    redraw2D();
});

canvas.addEventListener("wheel",e=>{

    e.preventDefault();

    scale *= e.deltaY<0 ? 1.1 : 0.9;

    redraw2D();
});

function toCanvas(x,y){

    return {
        x:offsetX+x*scale,
        y:offsetY-y*scale
    };
}

function drawGrid(){

    ctx.strokeStyle="#ddd";

    let step=scale;

    for(let x=offsetX%step;x<canvas.width;x+=step){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);
        ctx.stroke();
    }

    for(let y=offsetY%step;y<canvas.height;y+=step){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);
        ctx.stroke();
    }
}

function drawAxes(){

    ctx.strokeStyle="black";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(0,offsetY);
    ctx.lineTo(canvas.width,offsetY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(offsetX,0);
    ctx.lineTo(offsetX,canvas.height);
    ctx.stroke();
}

function drawCurve(f,color){

    ctx.strokeStyle=color;
    ctx.lineWidth=3;

    ctx.beginPath();

    let first=true;

    for(let px=0;px<canvas.width;px++){

        let x=(px-offsetX)/scale;

        let y;

        try{
            y=f(x);
        }catch{
            continue;
        }

        if(!isFinite(y)) continue;

        let py=offsetY-y*scale;

        if(first){
            ctx.moveTo(px,py);
            first=false;
        }
        else{
            ctx.lineTo(px,py);
        }
    }

    ctx.stroke();
}

//////////////////////////////////////////////////////////
// MAIN CALCULATION
//////////////////////////////////////////////////////////

let currentData=null;

function calculate(){

    try{

        const fExpr=document.getElementById("fInput").value;

        const f=makeFunction(fExpr);

        const {m,b}=parseLine(
            document.getElementById("axisInput").value
        );

        const lower=Number(
            document.getElementById("aInput").value
        );

        const upper=Number(
            document.getElementById("bInput").value
        );

        const k=Math.sqrt(m*m+1);

        function g(x){
            return m*x+b;
        }

        const integral=integrate(x=>{

            return (
                f(k*x)-g(k*x)
            )**2;

        },lower,upper);

        const volume=Math.PI*integral;

        document.getElementById("result").innerHTML=`

<div class="formula">

<b>Formula:</b><br><br>

V = π∫[${lower},${upper}]
(f(${k.toFixed(4)}x)-g(${k.toFixed(4)}x))²dx

<br><br>

<b>Volume:</b><br>
${volume.toFixed(8)}

</div>
`;

        currentData={
            f,m,b,
            lower,upper
        };

        redraw2D();

        if(showing3D){
            build3D();
        }

    }catch(err){

        document.getElementById("result").innerHTML=
        `<span style="color:red">${err}</span>`;
    }
}

function redraw2D(){

    if(!currentData) return;

    const {f,m,b}=currentData;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawGrid();
    drawAxes();

    drawCurve(f,"#22c55e");

    drawCurve(x=>m*x+b,"#ef4444");
}

//////////////////////////////////////////////////////////
// 3D
//////////////////////////////////////////////////////////

let scene,camera,renderer,controls,mesh;

let showing3D=false;

function toggle3D(){

    showing3D=!showing3D;

    const div=document.getElementById("viewer3d");

    div.style.display=showing3D ? "block":"none";

    if(showing3D){

        if(!renderer){
            init3D();
        }

        build3D();
    }
}

function init3D(){

    const div=document.getElementById("viewer3d");

    scene=new THREE.Scene();

    scene.background=new THREE.Color(0xffffff);

    camera=new THREE.PerspectiveCamera(
        45,
        div.clientWidth/700,
        0.1,
        1000
    );

    camera.position.set(0,10,20);

    renderer=new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(div.clientWidth,700);

    div.appendChild(renderer.domElement);

    controls=new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

    const light=new THREE.DirectionalLight(0xffffff,1);

    light.position.set(10,10,10);

    scene.add(light);

    scene.add(new THREE.AmbientLight(0xffffff,0.5));

    animate();
}

function build3D(){

    if(mesh){
        scene.remove(mesh);
    }

    if(!currentData) return;

    const {f,m,b,lower,upper}=currentData;

    const points=[];

    for(let x=lower;x<=upper;x+=0.03){

        let y=f(x);

        let axisY=m*x+b;

        let r=Math.abs(y-axisY);

        points.push(
            new THREE.Vector2(r,x)
        );
    }

    const geometry=new THREE.LatheGeometry(
        points,
        120
    );

    const material=new THREE.MeshNormalMaterial({
        side:THREE.DoubleSide
    });

    mesh=new THREE.Mesh(
        geometry,
        material
    );

    mesh.rotation.x=Math.PI/2;
    mesh.rotation.z=-Math.atan(m);

    scene.add(mesh);
}

function animate(){

    requestAnimationFrame(animate);

    if(controls){
        controls.update();
    }

    if(renderer){
        renderer.render(scene,camera);
    }
}

//////////////////////////////////////////////////////////
// EVENTS
//////////////////////////////////////////////////////////

document.getElementById("calcBtn")
.addEventListener("click",calculate);

document.getElementById("toggle3dBtn")
.addEventListener("click",toggle3D);

document.querySelectorAll("input")
.forEach(input=>{

    input.addEventListener("input",()=>{

        calculate();

    });

});

//////////////////////////////////////////////////////////
// START
//////////////////////////////////////////////////////////

calculate();

</script>

</body>
</html>
